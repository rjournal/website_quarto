title: 'The digitize Package: Extracting Numerical Data from Scatterplots'
abstract: I present the small R package [*digitize*](https://CRAN.R-project.org/package=digitize), designed to extract data from scatterplots with a simple method and suited to small datasets. I present an application of this method to the extraction of data from a graph whose source is not available.
