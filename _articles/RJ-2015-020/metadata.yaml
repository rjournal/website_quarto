title: 'apc: An R Package for Age-Period-Cohort Analysis'
abstract: The *apc* package includes functions for age-period-cohort analysis based on the canonical parametrisation of @KuangNielsenNielsen2008a. The package includes functions for organizing the data, descriptive plots, a deviance table, estimation of (sub-models of) the age-period-cohort model, a plot for specification testing, plots of estimated parameters, and sub-sample analysis.
