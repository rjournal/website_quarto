title: Estimating Heteroskedastic and Instrumental Variable Models for Binary Outcome Variables in R
abstract: "The objective of this article is to introduce the package \\CRANpkg{Rchoice} which provides functionality for estimating heteroskedastic and instrumental variable models for binary outcomes, whith emphasis on the calculation of the average marginal effects. To do so, I introduce two new functions of the \\CRANpkg{Rchoice} package using widely known applied examples. I also show how users can generate publication-ready tables of regression model estimates. \n"
