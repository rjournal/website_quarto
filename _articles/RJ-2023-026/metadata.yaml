title: 'nlmeVPC: Visual Model Diagnosis for the Nonlinear Mixed Effect Model'
date: '2023-08-26'
abstract: "A nonlinear mixed effects model is useful when the data are repeatedly measured within the same unit or correlated between units. Such models are widely used in medicine, disease mechanics, pharmacology, ecology, social science, psychology, etc. After fitting the nonlinear mixed effect model, model diagnostics are essential for verifying that the results are reliable. The visual predictive check (VPC) has recently been highlighted as a visual diagnostic tool for pharmacometric models. This method can also be applied to general nonlinear mixed effects models. However, functions for VPCs in existing R packages are specialized for pharmacometric model diagnosis, and are not suitable for general nonlinear mixed effect models. In this paper, we propose \\CRANpkg{nlmeVPC}, an R package for the visual diagnosis of various nonlinear mixed effect models. The \\pkg{nlmeVPC} package allows for more diverse model diagnostics, including visual diagnostic tools that extend the concept of VPCs along with the capabilities of existing R packages. \n"
