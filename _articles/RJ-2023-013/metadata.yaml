title: Generalized Mosaic Plots in the ggplot2 Framework
abstract: "Graphical methods for categorical variables are not well developed when compared with visualizations for numeric data. One method available for  multidimensional categorical data visualizations is mosaic plots. Mosaic plots are an easy and powerful option for identifying relationships between multiple categorical variables. Although various packages have implemented mosaic plots, no implementation within the grammar of graphics supports mosaic plots. We present a new implementation of mosaic plots in R, \\pkg{ggmosaic}, that implements a custom \\pkg{ggplot2} geom designed for generalized mosaic plots. Equipped with the functionality and flexibility of \\pkg{ggplot2}, \\pkg{ggmosaic} introduces new features not previously available for mosaic plots, including a novel method of incorporating a rendering of the underlying density via jittering. This paper provides an overview of the implementation and examples that highlight the versatility and ease of use of \\pkg{ggmosaic} while demonstrating the practicality of mosaic plots. \n"
