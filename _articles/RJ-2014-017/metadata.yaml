title: Addendum to "Statistical Software from a Blind Person's Perspective"
abstract: This short note explains a solution to a problem for blind users when using the R terminal under Windows Vista or Windows 7, as identified in [@GodfreyRJournal]. We note the way the solution was discovered and subsequent confirmatory experiments.
