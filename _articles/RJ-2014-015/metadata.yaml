title: Archiving Reproducible Research with R and Dataverse
abstract: Reproducible research and data archiving are increasingly important issues in research involving statistical analyses of quantitative data. This article introduces the [*dvn*](https://CRAN.R-project.org/package=dvn) package, which allows R users to publicly archive datasets, analysis files, codebooks, and associated metadata in Dataverse Network online repositories, an open-source data archiving project sponsored by Harvard University. In this article I review the importance of data archiving in the context of reproducible research, introduce the Dataverse Network, explain the implementation of the *dvn* package, and provide example code for archiving and releasing data using the package.
